<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bsg - L'Aventure Urbaine</title>
    <style>
        /* Style minimaliste et mobile-friendly */
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 2rem;
            background: #f8f9fa;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #764ba2;
            margin-bottom: 1rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* Style pour l'iframe du formulaire Grist */
        .grist-form {
            width: 100%;
            border: none;
            min-height: 400px;
            margin: 2rem 0;
        }

        .legal {
            font-size: 0.8rem;
            color: #999;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- REMPLACEZ CES TEXTES PAR L'UN DES 5 CONCEPTS CI-DESSUS -->
        <h1>Vous êtes invité(e) à l'aventure Bsg.</h1>
        <p class="subtitle">Rejoignez le cercle des premiers explorateurs. Un nombre limité d'accès est disponible pour
            transformer Lyon en votre terrain de jeu.</p>

        <!-- COLLEZ L'IFRAME DE VOTRE FORMULAIRE GRIST ICI -->
        <iframe src="https://docs.getgrist.com/forms/kybfsKLYaqbyRDoCdfJt2x/4" class="grist-form"
            title="Formulaire d'inscription Bsg">
        </iframe>
        <!-- FIN DE L'IFRAME -->

        <p class="legal">En vous inscrivant, vous acceptez de recevoir les informations de lancement de Bsg. Nous ne
            partagerons jamais votre email.</p>
    </div>
</body>

</html>
